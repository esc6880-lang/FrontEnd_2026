<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Caixa</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .topo {
      background: #800080;
      text-align: center;
      font-size: 40px;
      color: white;
      padding: 10px;
    }
  </style>
</head>

<body class="bg-primary bg-gradient">

  <div class="topo">Caixa</div>

  <div class="container mt-4">
    <div class="row">

      <!-- LISTA -->
      <div class="col-md-5">
        <div class="bg-light p-3 rounded">
          <h3>SUA COMPRA</h3>
          <ul id="lista" class="list-group"></ul>
        </div>
      </div>

      <!-- CONTROLE -->
      <div class="col-md-7">
        <div class="bg-light p-3 rounded">

          <h4>Total: R$ <span id="total">0.00</span></h4>

          <label>Código do produto</label>
          <input id="codValue" class="form-control mb-2">

          <button class="btn btn-success w-100" onclick="addproduto()">
            Adicionar produto
          </button>

        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
